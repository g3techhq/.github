name: Feature request
description: Propose a focused improvement or new capability.
title: "feat: "
labels:
  - enhancement
  - triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without requiring a particular implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: What other approaches or workarounds have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, sketches, related APIs, or compatibility considerations.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
