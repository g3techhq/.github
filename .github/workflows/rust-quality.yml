name: Reusable Rust quality

on:
  workflow_call:
    inputs:
      runner:
        description: JSON-compatible runner label or runner-group expression.
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and audit
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install quality tools
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: just@1.58.0,cargo-nextest@0.9.143,cargo-deny@0.20.2,typos-cli@1.50.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          just --version
          cargo nextest --version
          cargo deny --version
          typos --version

      - name: Run repository quality gate
        run: just ci
