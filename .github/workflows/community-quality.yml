name: Community standards

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: community-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Validate organization metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned validation tools
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: just@1.58.0,typos-cli@1.50.1,actionlint@1.7.12

      - name: Show tool versions
        run: |
          just --version
          typos --version
          actionlint --version

      - name: Validate organization metadata
        run: just ci
